<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Book Reader">
  <title>Book Audio Reader</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="book-icon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <img src="book-icon.svg" alt="Book Reader logo" class="logo">
      <div><h1>Book Audio Reader</h1><p>Upload a PDF and listen in English</p></div>
    </header>

    <section class="card upload-card">
      <label class="upload-btn" for="pdfInput">Choose PDF Book</label>
      <input id="pdfInput" type="file" accept="application/pdf,.pdf">
      <p id="fileName" class="muted">No book selected</p>
    </section>

    <section class="card">
      <div class="reader-head"><h2 id="bookTitle">Your Book</h2><span id="pageInfo">Page 0 / 0</span></div>
      <div id="bookText" class="book-text">Choose a PDF book to begin. The text from the current page will appear here.</div>
      <div class="page-controls">
        <button id="prevPage" class="secondary">← Previous</button>
        <button id="nextPage" class="secondary">Next →</button>
      </div>
    </section>

    <section class="card controls-card">
      <div class="audio-controls">
        <button id="playBtn" class="round primary" aria-label="Play">▶</button>
        <button id="pauseBtn" class="round" aria-label="Pause">⏸</button>
        <button id="stopBtn" class="round" aria-label="Stop">■</button>
      </div>
      <div class="speed-row">
        <label for="speed">Reading speed</label>
        <select id="speed">
          <option value="0.7">0.7x</option><option value="0.85">0.85x</option>
          <option value="1" selected>1x</option><option value="1.15">1.15x</option>
          <option value="1.3">1.3x</option><option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
      </div>
      <div class="voice-row"><label for="voiceSelect">English voice</label><select id="voiceSelect"></select></div>
      <p id="status" class="status">Ready</p>
    </section>

    <section class="card tips"><h3>iPhone</h3><p>Open this website in Safari → Share → Add to Home Screen.</p></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
